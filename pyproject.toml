[project]
name = "strava-climbing"
version = "0.1.0"
description = "Strava-for-bouldering video analytics: per-route leaderboards from raw climbing video"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Island Boys" },
]
dependencies = [
    "typer>=0.12",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=10.0",
    "ultralytics>=8.3",
    "supervision>=0.24",
    "streamlit>=1.40",
    "supabase>=2.9",
]

[project.optional-dependencies]
stage2 = [
    "transformers>=4.56",
    "torch>=2.4",
    "accelerate>=0.34",
    "scikit-learn>=1.5",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
strava = "strava_climbing.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strava_climbing"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM"]
ignore = [
    "RUF002",  # ambiguous × in docstrings — intentional (e.g. "3-5× faster")
    "B008",    # typer.Option in defaults is the canonical Typer pattern
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
